name: release

# Every push to main IS a release — there is no knob to forget. The workflow
# runs the tests, computes the next version from the latest v* tag (patch by
# default; put "#minor" or "#major" in the head commit's SUBJECT line to bump
# those — the body is deliberately ignored, since prose that merely mentions a
# token must not trigger it), and publishes a GitHub release, which creates
# the tag. `go install github.com/schuettc/scratch@latest` resolves the
# highest semver tag, so consumers get the new code as soon as the release
# lands.
#
# A push whose HEAD is already tagged (a re-run, or a tag pushed by hand)
# releases nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: version math needs the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "HEAD is already tagged ($(git tag --points-at HEAD 'v*' | tr '\n' ' ')) — nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          latest="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<< "${latest#v}"
          msg="$(git log -1 --pretty=%s)"
          case "$msg" in
            *"#major"*) tag="v$((major + 1)).0.0" ;;
            *"#minor"*) tag="v${major}.$((minor + 1)).0" ;;
            *)          tag="v${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "Releasing $tag (previous: $latest)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "scratch ${{ steps.ver.outputs.tag }}" --generate-notes
